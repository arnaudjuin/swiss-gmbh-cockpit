name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed demo data (creates schema)
        run: python seed_demo.py
      - name: Smoke tests
        run: python -m pytest tests/test_smoke.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit-next/package-lock.json
      - run: npm ci
      - run: npm run build
